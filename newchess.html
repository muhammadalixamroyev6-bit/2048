<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shaxmat | FreeTime GAMES</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --board-light: #f0d9b5;
            --board-dark: #b58863;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --highlight-move: rgba(255, 235, 59, 0.5);
            --highlight-selected: rgba(76, 175, 80, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        header {
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .status-badge {
            display: inline-block;
            font-size: 13px;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        /* Qiyinchilik rejimlar tugmasi */
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        /* SHAXMAT TAXTASI - Kataklar kichraymasligi uchun maxsus o'lchamlar */
        .board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }

        .square.selected {
            background-color: var(--highlight-selected) !important;
        }

        .square.last-move {
            background-color: var(--highlight-move) !important;
        }

        /* Figura belgisi va nuqta */
        .piece {
            width: 88%;
            height: 88%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 2;
            transition: transform 0.1s ease;
        }

        .square:active .piece {
            transform: scale(1.1);
        }

        .legal-hint {
            position: absolute;
            width: 26%;
            height: 26%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: 1;
        }

        .legal-hint.capture {
            width: 85%;
            height: 85%;
            background-color: transparent;
            border: 4px solid rgba(239, 68, 68, 0.6);
            border-radius: 50%;
        }

        /* Boshqaruv tugmalari */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        footer {
            font-size: 11px;
            color: var(--text-sub);
            text-align: center;
            margin-top: 4px;
        }

        /* Modal: Piyodani almashtirish (Promotion) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #1e293b;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,
